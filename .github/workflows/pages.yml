name: Publish client previews

on:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate static files
        run: python3 scripts/prepare.py
      - name: Check JavaScript syntax
        run: |
          find public -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_public.py "$PAGE_URL"
